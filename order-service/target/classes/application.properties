spring.application.name=order-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:h2:file:./order-service-data/orders;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJwtLab2026VeryLong123456789}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080}
