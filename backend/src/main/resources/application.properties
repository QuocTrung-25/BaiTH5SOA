spring.application.name=soa-backend
server.port=8080
server.additional-ports=8081,8082,8083

# Cau hinh ket noi MySQL database baisoa
spring.datasource.url=jdbc:mysql://localhost:3306/baisoa?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Cau hinh JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cau hinh JWT
security.jwt.secret=ThisIsASecretKeyForJwtLab2026VeryLong123456789
security.jwt.expiration=3600000